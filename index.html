<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OANDA Quotes</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
      }
      pre {
        margin: 0;
        padding: 24px;
        font-size: 18px;
        line-height: 1.8;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <pre id="quotes">Loading...</pre>

    <script>
      const quotesEl = document.getElementById('quotes');

      const sources = [
        { label: 'XAUUSD', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/GC=F') },
        { label: 'BTCUSD', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD') },
        { label: 'XBRUSD', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/BZ=F') },
        { label: 'US30Y', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/^TYX') },
      ];

      async function fetchPrice(source) {
        try {
          const response = await fetch(`${source.url}&_=${Date.now()}`, {
            cache: 'no-store',
          });
          const text = await response.text();
          const data = JSON.parse(text);
          const price = Number(data?.chart?.result?.[0]?.meta?.regularMarketPrice);
          return Number.isFinite(price) ? price : null;
        } catch (error) {
          return null;
        }
      }

      async function loadQuotes() {
        const results = await Promise.all(
          sources.map(async (source) => {
            const value = await fetchPrice(source);
            return `${source.label} = ${value ?? 'N/A'}`;
          })
        );

        quotesEl.textContent = results.join('\n');
      }

      loadQuotes();
      setInterval(loadQuotes, 30000);
      window.addEventListener('pageshow', () => {
        loadQuotes();
      });
    </script>
  </body>
</html>
