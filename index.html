<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OANDA Quotes</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
      }
      pre {
        margin: 0;
        padding: 24px;
        font-size: 18px;
        line-height: 1.8;
        font-family: Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <pre id="quotes">Loading...</pre>

    <script>
      const quotesEl = document.getElementById('quotes');

      async function loadQuotes() {
        try {
          const response = await fetch('/api/quotes', { cache: 'no-store' });
          const data = await response.json();

          quotesEl.textContent = [
            `XAUUSD = ${data.XAUUSD ?? 'N/A'}`,
            `BTCUSD = ${data.BTCUSD ?? 'N/A'}`,
            `XBRUSD = ${data.XBRUSD ?? 'N/A'}`,
            `US30Y = ${data.US30Y ?? 'N/A'}`,
          ].join('\n');
        } catch (error) {
          quotesEl.textContent = 'Error loading quotes';
        }
      }

      loadQuotes();
      setInterval(loadQuotes, 30000);
      window.addEventListener('pageshow', () => {
        loadQuotes();
      });
    </script>
  </body>
</html>
I’ve switched the page to use a local API endpoint so the browser no longer depends on the blocked extern
