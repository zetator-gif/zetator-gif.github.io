<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OANDA Quotes</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
      }
      pre {
        margin: 0;
        padding: 24px;
        font-size: 18px;
        line-height: 1.8;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="quotes"></pre>

    <script>
      const quotesEl = document.getElementById('quotes');

      const quotes = {
        XAUUSD: 0,
        BTCUSD: 0,
        XBRUSD: 0,
        US30Y: 0,
      };

      function renderQuotes() {
        quotesEl.textContent = [
          `XAUUSD = ${quotes.XAUUSD}`,
          `BTCUSD = ${quotes.BTCUSD}`,
          `XBRUSD = ${quotes.XBRUSD}`,
          `US30Y = ${quotes.US30Y}`,
        ].join('\n');
      }

      renderQuotes();
    </script>
  </body>
</html>
