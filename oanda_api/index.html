<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Quotes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css">
  <style>
    body { margin: 0; background: #111; color: #eee; font: 12px Hack, monospace; }
    main { width: min(100% - 12px, 500px); margin: 8px 0; }
    header, section { display: grid; grid-template-columns: 78px 1fr 1fr 1fr; gap: 7px; padding: 6px 0; }
    header { color: #ffd700; font-size: 10px; font-weight: 700; border-bottom: 1px solid #444; text-transform: uppercase; }
    section { border-bottom: 1px solid #292929; }
    .right { text-align: right; }
    section strong { color: #ffd700; }
    section .quote.up { color: #00c853; }
    section .quote.down { color: #f44336; }
  </style>
</head>
<body>
  <main>
    <header><span>SYMBOL</span><span class="right">PRICE</span><span class="right">DAILY HIGH</span><span class="right">DAILY LOW</span></header>
    <section><strong>XAUUSD</strong><span id="XAUUSD" class="right">...</span><span id="XAUUSD-high" class="right">...</span><span id="XAUUSD-low" class="right">...</span></section>
    <section><strong>BTCUSD</strong><span id="BTCUSD" class="right">...</span><span id="BTCUSD-high" class="right">...</span><span id="BTCUSD-low" class="right">...</span></section>
    <section><strong>XBRUSD</strong><span id="XBRUSD" class="right">...</span><span id="XBRUSD-high" class="right">...</span><span id="XBRUSD-low" class="right">...</span></section>
    <section><strong>US30Y</strong><span id="US30Y" class="right">...</span><span id="US30Y-high" class="right">...</span><span id="US30Y-low" class="right">...</span></section>
  </main>
  <script>
    const displayValue = value => value == null ? 'N/A' : Number(value).toFixed(2);
    const setQuote = (name, quote) => {
      const direction = quote?.price < quote?.previousClose ? 'down' : 'up';
      for (const suffix of ['', '-high', '-low']) {
        const cell = document.getElementById(name + suffix);
        cell.textContent = displayValue(quote?.[suffix.slice(1) || 'price']);
        cell.className = 'right quote ' + direction;
      }
    };
    async function loadQuotes() {
      const data = await fetch('quotes.json?time=' + Date.now()).then(response => response.json());
      for (const [name, quote] of Object.entries(data)) setQuote(name, quote);
    }
    loadQuotes();
    setInterval(loadQuotes, 60000);
  </script>
</body>
</html>
